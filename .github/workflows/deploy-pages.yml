name: Deploy site to Pages

# Option 2 — build on GitHub's servers, never commit dist/.
#
# GitHub Pages serves this monorepo as a whole site (root landing + each project
# at its sub-path, e.g. /PGHub/dist/, /PG.Play/dist/, /onlineChess/dist/, plus the
# static folders like /chess, /blog). This workflow reproduces that whole site in
# an artifact: it checks out the SOURCE, builds every Vite project fresh, and
# publishes the result. The generated dist/ folders exist only for the run and
# never enter Git history.
#
# ONE-TIME SETUP: Repo Settings → Pages → "Build and deployment" → Source →
# "GitHub Actions" (switch it off "Deploy from a branch"). After that, every push
# to main rebuilds and redeploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Standard Pages deploy permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build every project → assemble site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build PGHub
        working-directory: PGHub
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # TURN relay for PGBattle video calls (client-baked; VITE_ vars are public by design).
          VITE_TURN_URL: ${{ secrets.VITE_TURN_URL }}
          VITE_TURN_USER: ${{ secrets.VITE_TURN_USER }}
          VITE_TURN_CRED: ${{ secrets.VITE_TURN_CRED }}
        run: npm ci && npm run build

      - name: Build onlineChess
        working-directory: onlineChess
        run: npm ci && npm run build

      - name: Build PG.Play
        working-directory: PG.Play
        # `npx vite build` on purpose — bypasses PG.Play's heavy prebuild
        # (catalog validation + vitest); that belongs in CI, not the deploy path,
        # so a flaky test never blocks publishing the rest of the site.
        run: npm ci && npx vite build

      - name: Assemble the published site
        run: |
          # The whole repo IS the site (root landing + sub-path projects + static
          # folders). Copy it, minus repo plumbing, node_modules, and source-only
          # game art (built into PG.Play/dist, never served directly).
          # The Vite apps (PGHub / PG.Play / onlineChess) are served from their dist/,
          # so their src/ and scripts/ are build-only — exclude them so build tooling
          # and seed/migration scripts are never served on the live domain. Only these
          # three apps have src/ or scripts/ dirs; the static folders have none, so the
          # blanket **/src and **/scripts patterns can't strip anything that's served.
          #
          # `**/scripts` only matches a *nested* scripts/ — rsync needs a literal
          # slash for the pattern to apply — so the repo-root scripts/ (sitemap
          # generator) needs its own `/scripts` rule. Same for /supabase.
          #
          # Everything below the .DS_Store line is internal material that GitHub
          # Pages was happily serving to anyone who asked: CLAUDE.md, QA backlogs,
          # audits and per-project docs/ were all live and indexable (PGHub/CLAUDE.md
          # was a public 46KB file). None of it is linked from the site, so dropping
          # it costs nothing and keeps crawl budget on real pages.
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='**/node_modules' \
            --exclude='**/src' \
            --exclude='**/scripts' \
            --exclude='/scripts' \
            --exclude='.DS_Store' \
            --exclude='PG.Play/assets' \
            --exclude='*.md' \
            --exclude='**/docs' \
            --exclude='/docs' \
            --exclude='**/supabase' \
            --exclude='/supabase' \
            --exclude='**/test' \
            --exclude='.java_test_harness' \
            --exclude='PGHub/logs' \
            --exclude='PG.Play/frost-fight-gallery' \
            ./ _site/
          # Pages must not run Jekyll (we ship folders that start with _ / .).
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
