<!DOCTYPE html>
<!--
  The landing page moved to the site root (https://pushkalgupta.com/).

  Every in-repo link now points at "/" directly, but this stub stays behind for
  anything outside the repo that still remembers the old address — bookmarks,
  and the URL printed in older READMEs. It redirects, and declares the root as
  its canonical, so Google folds any ranking signal into "/" instead of
  splitting it across two URLs that show the same page.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pushkal Gupta</title>
    <link rel="canonical" href="https://pushkalgupta.com/" />
    <meta http-equiv="refresh" content="0; url=/" />
    <meta name="robots" content="noindex, follow" />
    <script>
      window.location.replace('/');
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="/">pushkalgupta.com</a>.</p>
  </body>
</html>
