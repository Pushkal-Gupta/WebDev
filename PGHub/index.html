    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PG.Hub",
        "url": "https://pushkalgupta.com/PGHub/dist/",
        "description": "Visual DSA roadmap, judged practice problems, an in-browser compiler, ML lessons, contests and algorithm visualisations.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript.",

        "isPartOf": { "@type": "WebSite", "@id": "https://pushkalgupta.com/#website" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Pushkal Gupta", "url": "https://pushkalgupta.com/" },
        "featureList": [
          "Visual DSA roadmap across 22 topics in 7 tiers",
          "Thousands of practice problems graded by a real judge",
          "In-browser compiler for Python, JavaScript, Java and C++",
          "Step-by-step algorithm visualisations and dry runs",
          "Machine-learning lessons and CUDA material",
          "Contests, company-wise prep and spaced repetition"
        ]
      }
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Inline shell + theme bootstrap. Goals:
      1. Set [data-theme] from localStorage before React mounts → no flash of wrong theme.
      2. Render Navbar + SubNav skeleton so the first paint shows app chrome
         (not a blank screen) before any JS executes.
      The real React app mounts inside #root and overwrites this shell.
    -->
    <script>
      (function () {
        try {
          var ALL = ['dark','light','midnight','midnight-light','solarized','solarized-dark','dracula','dracula-light','nord','nord-light','rose-pine','rose-pine-dawn','gruvbox','mocha','cyberpunk','forest'];
          var LIGHT = ['light','midnight-light','solarized','dracula-light','nord-light','rose-pine-dawn'];
          var t = localStorage.getItem('pg-theme') || 'dark';
          var ok = ALL.indexOf(t) >= 0 ? t : 'dark';
          document.documentElement.setAttribute('data-theme', ok);
          document.documentElement.setAttribute('data-theme-mode', LIGHT.indexOf(ok) >= 0 ? 'light' : 'dark');
          // Visual preferences (Settings → Preferences) applied before paint so they
          // take effect on every load, not only after the Settings modal mounts.
          var dens = localStorage.getItem('pg-pref-density');
          if (dens === 'compact') document.documentElement.setAttribute('data-density', 'compact');
          var fs = localStorage.getItem('pg-pref-font-scale');
          if (fs === 'small' || fs === 'large') document.documentElement.setAttribute('data-font-scale', fs);
          if (localStorage.getItem('pg-pref-reduce-motion') === 'true') document.documentElement.setAttribute('data-reduce-motion', 'true');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme-mode', 'dark');
        }
      })();
    </script>
    <style id="pg-shell-style">
      /* Bootstrap-only styles. Real app CSS takes over on mount. */
      :root { --bg: #0a1615; --surface: #0f1e1d; --text-main: #ffffff; --text-dim: #6f9b98;
              --accent: #00fff5; --border: #17423e; }
      [data-theme="light"] { --bg: #f5f2ed; --surface: #ffffff; --text-main: #1a1a1a;
              --text-dim: #666666; --accent: #008a7e; --border: #e0ddd7; }
      [data-theme="midnight"] { --bg: #0b1024; --surface: #131a3a; --text-main: #f5f4ff;
              --text-dim: #8b8fb8; --accent: #a78bfa; --border: #1f2950; }
      [data-theme="solarized"] { --bg: #fdf6e3; --surface: #eee8d5; --text-main: #073642;
              --text-dim: #586e75; --accent: #268bd2; --border: #d8d2bf; }
      [data-theme="dracula"] { --bg: #282a36; --surface: #21222c; --text-main: #f8f8f2;
              --text-dim: #8b8ca0; --accent: #ff79c6; --border: #383a4a; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                   background: var(--bg); color: var(--text-main);
                   font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
      #pg-shell { display: flex; flex-direction: column; height: 100vh; }
      .pg-shell-header { padding: 1.2rem 0; border-bottom: 1px solid var(--border);
                         background: var(--bg); }
      .pg-shell-wrap { width: 94%; max-width: 1400px; margin: 0 auto;
                       display: flex; align-items: center; justify-content: space-between; }
      .pg-shell-brand { font-family: 'Lora', serif; font-size: 1.3rem; font-weight: 600;
                        color: var(--text-main); }
      .pg-shell-brand span { color: var(--accent); font-weight: 700; }
      .pg-shell-right { display: flex; align-items: center; gap: 1.5rem; }
      .pg-shell-toggle { display: flex; align-items: center; gap: 0.6rem; }
      .pg-shell-toggle-label { font-family: 'Space Mono', monospace; font-size: 0.6rem;
                        color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
      .pg-shell-switch { width: 30px; height: 15px; background: var(--border); border-radius: 15px;
                         position: relative; flex-shrink: 0; }
      .pg-shell-switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 11px;
                         height: 11px; background: var(--text-dim); border-radius: 50%; }
      .pg-shell-auth { font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700;
                        letter-spacing: 0.07em; text-transform: uppercase; color: var(--accent);
                        border: 1px solid var(--accent); padding: 0.4rem 0.8rem; border-radius: 3px; }
      .pg-shell-subnav { background: var(--bg); border-bottom: 1px solid var(--border); }
      .pg-shell-subnav-inner { width: 94%; max-width: 1400px; margin: 0 auto;
                               padding: 0.5rem 0; display: flex; justify-content: center;
                               gap: 1.4rem; overflow: hidden; }
      .pg-shell-link { display: inline-flex; align-items: center; gap: 0.45rem;
                       font-family: 'Space Mono', monospace; font-size: 0.82rem;
                       font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
                       color: var(--text-dim); padding: 0.4rem 0.7rem; }
      .pg-shell-link svg { width: 17px; height: 17px; opacity: 0.85; }
      .pg-shell-link i { font-style: normal; font-size: 0.64em; font-weight: 600; opacity: 0.55; margin-right: 0.01em; }
      .pg-shell-body { flex: 1; display: flex; align-items: center; justify-content: center;
                       padding: 2rem; }
      .pg-shell-loader { display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
                        font-family: 'Space Mono', monospace; font-size: 0.7rem;
                        color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
      .pg-shell-spinner { width: 18px; height: 18px; border: 2px solid var(--border);
                          border-top-color: var(--accent); border-radius: 50%;
                          animation: pg-spin 0.8s linear infinite; }
      @keyframes pg-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .pg-shell-spinner { animation: none; } }
    </style>
  </head>
