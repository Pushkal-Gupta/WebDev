<!DOCTYPE html>
<!--
  The blog index moved from /blog/blog.html to /blog/.

  Nothing in the repo links here any more, but this was the most-shared URL on
  the site, so the stub stays for bookmarks and anything already pasted into a
  message. noindex + canonical means Google folds it into /blog/ rather than
  treating it as a second copy of the index.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PG.Blog</title>
    <link rel="canonical" href="https://pushkalgupta.com/blog/" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/blog/" />
    <script>
      // Preserve ?post=<id> so an old deep link still opens the right essay.
      window.location.replace('/blog/' + window.location.search);
    </script>
  </head>
  <body>
    <p>This page has moved to <a href="/blog/">pushkalgupta.com/blog</a>.</p>
  </body>
</html>
