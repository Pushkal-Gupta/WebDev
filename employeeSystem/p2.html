    <style>
      /* These pages use a Bootstrap navbar brand where a heading should be, so
         they ship no <h1> at all — a screen reader gets no page title, and a
         crawler no statement of what the page is. This adds the missing heading
         without touching the visual design. It names the page exactly as the
         <title> does; it is not extra keyword text. */
      .pg-visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
